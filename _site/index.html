<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Woovebox Patches Exchange</title>
  <script>
    // Thème choisi par l'utilisateur, sinon préférence du navigateur
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <nav class="navbar bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">Woovebox Patches Exchange</a>
      <div class="d-flex gap-2">
        <a class="btn btn-primary"
           href="mailto:you@example.com?subject=Woovebox%20patch%20submission">
          <i class="fa-regular fa-envelope"></i>
          <span class="d-none d-sm-inline">Submit a patch</span>
        </a>
        <button id="theme-toggle" type="button" class="btn btn-outline-secondary"
                aria-label="Toggle dark mode">
          <i class="fa-solid fa-moon icon-moon"></i>
          <i class="fa-solid fa-lightbulb icon-sun"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    
<form class="row g-2 mb-4">
  <fieldset class="col-12 col-md" data-filter-group>
    <select id="filter-tag" class="form-select" aria-label="Tag">
      <option value="">All tags</option>
      
      <option value=".tag-bass">Bass</option>
      
      <option value=".tag-lead">Lead</option>
      
    </select>
  </fieldset>

  <fieldset class="col-12 col-md" data-filter-group>
    <select id="filter-style" class="form-select" aria-label="Style">
      <option value="">All styles</option>
      
      <option value=".style-transe">Transe</option>
      
    </select>
  </fieldset>

  <fieldset class="col-12 col-md" data-filter-group>
    <select id="filter-author" class="form-select" aria-label="Author">
      <option value="">All authors</option>
      
      <option value=".author-dakanok">Dakanok</option>
      
    </select>
  </fieldset>

  <div class="col-12 col-md-auto">
    <button type="reset" class="btn btn-outline-secondary w-100">
      <i class="fa-solid fa-xmark"></i> Reset
    </button>
  </div>
</form>

<div id="patches" class="row g-4">
  
  <div class="col-12 col-md-6 col-lg-4 mix tag-bass">
    <div class="card h-100">
      <div class="card-body">
        <h2 class="h5 card-title">
          
          Bass 01
        </h2>
        <a href="#" class="badge rounded-pill text-bg-light text-decoration-none"
           data-filter-target="filter-tag"
           data-filter-value=".tag-bass">Bass</a>
        
        <audio class="w-100 mt-3" controls preload="none"
               src="/assets/samples/bass01.mp3"></audio>
      </div>
      <div class="card-footer bg-transparent">
        <a class="btn btn-primary w-100" download
           href="/assets/patches/bass01.syx">
          <i class="fa-solid fa-download"></i> Download
        </a>
      </div>
    </div>
  </div>
  
  <div class="col-12 col-md-6 col-lg-4 mix tag-lead style-transe author-dakanok">
    <div class="card h-100">
      <div class="card-body">
        <h2 class="h5 card-title">
          
          <small class="patch-author text-body-secondary fw-normal">
            <i class="fa-regular fa-user"></i>
            <a href="#" class="link-secondary"
               data-filter-target="filter-author"
               data-filter-value=".author-dakanok">Dakanok</a>
            /
          </small>
          
          Lead 01
        </h2>
        <a href="#" class="badge rounded-pill text-bg-light text-decoration-none"
           data-filter-target="filter-tag"
           data-filter-value=".tag-lead">Lead</a>
        
        <a href="#" class="badge rounded-pill text-bg-info text-decoration-none"
           data-filter-target="filter-style"
           data-filter-value=".style-transe"><i class="fa-solid fa-music"></i> Transe</a>
        
        <audio class="w-100 mt-3" controls preload="none"
               src="/assets/samples/lead01.mp3"></audio>
      </div>
      <div class="card-footer bg-transparent">
        <a class="btn btn-primary w-100" download
           href="/assets/patches/lead01.syx">
          <i class="fa-solid fa-download"></i> Download
        </a>
      </div>
    </div>
  </div>
  
</div>

<div class="d-flex flex-column align-items-center gap-2 mt-4">
  <div class="mixitup-page-list d-flex flex-wrap justify-content-center gap-2"></div>
  <div class="mixitup-page-stats text-body-secondary small"></div>
</div>
  </main>

  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/assets/vendor/mixitup/mixitup.min.js"></script>
  <script src="/assets/vendor/mixitup/mixitup-pagination.min.js"></script>
  <script src="/assets/vendor/mixitup/mixitup-multifilter.min.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
